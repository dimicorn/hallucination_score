[project]
name = "provenance"
version = "0.1.0"
description = "Feature-level prior-data attribution in astronomical image reconstruction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax==0.4.18",
    # x86-64 Linux gets the CUDA 12 build of the same jaxlib from Google's wheel index
    # (it falls back to CPU without a GPU), with cuDNN pinned to the 8.9 it is built
    # against; everything else gets the CPU build from PyPI.
    "jaxlib==0.4.18 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
    "jaxlib==0.4.18+cuda12.cudnn89 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax[cuda12_pip]==0.4.18 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cudnn-cu12==8.9.7.29 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "equinox==0.10.7",
    "galaxygrad==0.0.19",
    "numpy<2",
    "scipy==1.11.4",
    "optax",
    "pandas",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[[tool.uv.index]]
name = "jax-cuda"
url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html"
format = "flat"
explicit = true

[tool.uv.sources]
jaxlib = { index = "jax-cuda", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:As of Equinox 0.10.7:UserWarning"]
