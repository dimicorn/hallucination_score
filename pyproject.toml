[project]
name = "provenance"
version = "0.1.0"
description = "Feature-level prior-data attribution in astronomical image reconstruction"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax==0.4.18",
    "jaxlib==0.4.18",
    "equinox==0.10.7",
    "galaxygrad==0.0.19",
    "numpy<2",
    "scipy==1.11.4",
    "optax",
    "pandas",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
